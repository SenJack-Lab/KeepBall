name: Android CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Fail fast if signing secrets missing
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          missing=0
          [ -n "$KEY_ALIAS" ] || { echo "::error::org secret KEY_ALIAS is missing"; missing=1; }
          [ -n "$KEYSTORE_PASSWORD" ] || { echo "::error::org secret KEYSTORE_PASSWORD is missing"; missing=1; }
          [ -n "$KEYSTORE_BASE64" ] || { echo "::error::org secret KEYSTORE_BASE64 is missing"; missing=1; }
          exit $missing

      - name: Restore unified keystore from org secret
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p signing
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > signing/unified.jks
          keytool -list -keystore signing/unified.jks \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" >/dev/null \
            && echo "keystore OK, SHA256 cert fingerprint:" \
            && keytool -list -v -keystore signing/unified.jks \
                 -storepass "${{ secrets.KEYSTORE_PASSWORD }}" | grep -m1 'SHA256:'

      - name: Build debug APK (unified-signed)
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          KEY_ALIAS_TRIM="$(printf '%s' "$KEY_ALIAS" | tr -d '[:space:]')"
          gradle assembleDebug --no-daemon \
            -PKEYSTORE_BASE64="${{ secrets.KEYSTORE_BASE64 }}" \
            -PKEYSTORE_PASSWORD="${{ secrets.KEYSTORE_PASSWORD }}" \
            -PKEY_ALIAS="$KEY_ALIAS_TRIM" \
            -PKEY_PASSWORD="${{ secrets.KEYSTORE_PASSWORD }}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: keepball-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Print APK signing certificate
        run: |
          keytool -printcert -jarfile app/build/outputs/apk/debug/*.apk | grep -E "SHA256:" | head -1
